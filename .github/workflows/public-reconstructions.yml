name: Public reconstructions

on:
  pull_request:
    paths:
      - 'data/public-reconstructions.json'
      - 'data/claims.json'
      - 'api/public-reconstructions.json'
      - 'docs/public-reconstruction-corpus.md'
      - 'scripts/build_public_reconstructions.py'
      - '.github/workflows/public-reconstructions.yml'
  push:
    branches:
      - main
    paths:
      - 'data/public-reconstructions.json'
      - 'data/claims.json'
      - 'api/public-reconstructions.json'
      - 'docs/public-reconstruction-corpus.md'
      - 'scripts/build_public_reconstructions.py'
      - '.github/workflows/public-reconstructions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate public reconstructions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate corpus and generated outputs
        run: python scripts/build_public_reconstructions.py --check --report public-reconstruction-report.md
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-reconstruction-validation
          path: public-reconstruction-report.md
          if-no-files-found: warn
          retention-days: 30
