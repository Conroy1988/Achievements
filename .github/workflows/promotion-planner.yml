name: Mission evidence promotion planner

on:
  pull_request:
    paths:
      - 'api/mission-review-queue.json'
      - 'api/promotion-plans.json'
      - 'api/promotion-plan-schema.json'
      - 'data/claims.json'
      - 'data/achievements.json'
      - 'data/promotion-plan-policy.json'
      - 'data/promotion-plan.schema.json'
      - 'reviews/mission/**'
      - 'plans/promotion/**'
      - 'docs/promotion-planner.md'
      - 'scripts/build_promotion_plans.py'
      - 'tests/test_promotion_planner.py'
      - '.github/workflows/promotion-planner.yml'
  push:
    branches:
      - main
    paths:
      - 'api/mission-review-queue.json'
      - 'api/promotion-plans.json'
      - 'api/promotion-plan-schema.json'
      - 'data/claims.json'
      - 'data/achievements.json'
      - 'data/promotion-plan-policy.json'
      - 'data/promotion-plan.schema.json'
      - 'reviews/mission/**'
      - 'plans/promotion/**'
      - 'docs/promotion-planner.md'
      - 'scripts/build_promotion_plans.py'
      - 'tests/test_promotion_planner.py'
      - '.github/workflows/promotion-planner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate promotion plans
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate planner and generated outputs
        run: python scripts/build_promotion_plans.py --check --report promotion-planner-report.md
      - name: Run promotion planner tests
        run: python -m unittest tests/test_promotion_planner.py -v
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: promotion-planner-validation
          path: promotion-planner-report.md
          if-no-files-found: warn
          retention-days: 30
